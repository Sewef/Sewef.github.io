<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sewef.github.io</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 64px 24px;
            background: #fdf6e3;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        main {
            width: min(100%, 820px);
            margin: 0 auto;
        }
        .page-header {
            margin-bottom: 48px;
            text-align: center;
        }
        .page-header h1 {
            margin: 0 0 8px;
            color: #586e75;
            font-size: clamp(2rem, 7vw, 3rem);
        }
        .page-header p {
            margin: 0;
            color: #839496;
        }
        .project-group + .project-group {
            margin-top: 52px;
            padding-top: 42px;
            border-top: 1px solid #ded7c3;
        }
        .group-heading {
            margin-bottom: 20px;
        }
        .group-heading h2 {
            margin: 0 0 5px;
            color: #b58900;
            font-size: 1.25rem;
        }
        .group-heading p {
            margin: 0;
            color: #839496;
            font-size: .92rem;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 18px;
        }
        .fancy-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eee8d5 0%, #fdf6e3 100%);
            color: #586e75;
            border: 2px solid #b58900;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(101, 123, 131, 0.10);
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
            outline: none;
            position: relative;
        }
        .fancy-btn:hover, .fancy-btn:focus {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 8px 32px rgba(101, 123, 131, 0.18);
            border-color: #cb4b16;
        }
        .logo {
            max-width: 48px;
            max-height: 48px;
            width: auto;
            height: auto;
            margin-bottom: 10px;
            background: none;
            border-radius: 8px;
            display: block;
            object-fit: contain;
        }
        a.fancy-btn {
            min-height: 120px;
            text-decoration: none;
        }
        @media (max-width: 480px) {
            body {
                padding: 40px 18px;
            }
            .button-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <!-- <header class="page-header">
            <h1>Sewef's projects</h1>
            <p>Tools and extensions for tabletop games.</p>
        </header> -->

        <section class="project-group" aria-labelledby="ptu-heading">
            <div class="group-heading">
                <h2 id="ptu-heading">PTU tools</h2>
                <p>Data and character-building utilities for Pokémon Tabletop United.</p>
            </div>
            <div class="button-grid">
                <a class="fancy-btn" href="/ptu/index.html">
                    <img class="logo" src="/ptu/img/logo64.png" alt="PTU-Data logo" />
                    PTU-Data
                </a>
                <a class="fancy-btn" href="https://ptu-gen.onrender.com/index.html">
                    <img class="logo" src="/ptu-gen/PTU-Gen.png" alt="PTU-Gen logo" />
                    PTU-Gen
                </a>
            </div>
        </section>

        <section class="project-group" aria-labelledby="owlbear-heading">
            <div class="group-heading">
                <h2 id="owlbear-heading">Owlbear Rodeo extensions</h2>
                <p>Extensions and companion tools for your virtual tabletop.</p>
            </div>
            <div class="button-grid">
                <a class="fancy-btn" href="/macrohero/index.html">
                    <img class="logo" src="/macrohero/logo.png" alt="MacroHero logo" />
                    MacroHero
                </a>
                <a class="fancy-btn" href="/justDices/index.html">
                    <img class="logo" src="/justDices/JustDices.png" alt="JustDices logo" />
                    JustDices
                </a>
                <a class="fancy-btn" href="/alinktothepaste/index.html">
                    <img class="logo" src="https://alinktothepaste.onrender.com/icon.svg" alt="A Link to the Paste logo" />
                    A Link to the Paste
                </a>
                <a class="fancy-btn" href="/fanfare/index.html">
                    <img class="logo" src="https://fanfare.onrender.com/icon.svg" alt="Fanfare logo" />
                    Fanfare
                </a>
            </div>
        </section>
    </main>
</body>
</html>
